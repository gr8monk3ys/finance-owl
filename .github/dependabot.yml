# Dependabot retune 2026-09-10: this repo is deployed, so version updates stay on,
# but monthly with a small PR cap. Security updates are a repo setting and unaffected.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  reviewers:
  - natalyscaturchio
  labels:
  - dependencies
  - automated
  groups:
    typescript-ecosystem:
      patterns:
      - typescript
      - typescript-eslint
      - '@typescript-eslint/*'
      update-types:
      - minor
      - patch
    eslint:
      patterns:
      - eslint
      - '@eslint/*'
      - eslint-*
      update-types:
      - minor
      - patch
    turbo:
      patterns:
      - turbo
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: zod
    update-types:
    - version-update:semver-major
  - dependency-name: expo
  - dependency-name: expo-*
  - dependency-name: react
  - dependency-name: '@types/react'
  - dependency-name: react-native
  - dependency-name: react-native-*
  - dependency-name: '@react-navigation/*'
  - dependency-name: '@sentry/react-native'
- package-ecosystem: npm
  directory: /packages/backend
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  reviewers:
  - natalyscaturchio
  labels:
  - dependencies
  - backend
  - automated
  groups:
    nestjs:
      patterns:
      - '@nestjs/*'
      update-types:
      - major
      - minor
      - patch
    drizzle:
      patterns:
      - drizzle-orm
      - drizzle-kit
      update-types:
      - minor
      - patch
    sentry:
      patterns:
      - '@sentry/*'
      update-types:
      - minor
      - patch
    testing:
      patterns:
      - vitest
      - supertest
      - '@types/*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /packages/frontend
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  reviewers:
  - natalyscaturchio
  labels:
  - dependencies
  - frontend
  - automated
  groups:
    svelte:
      patterns:
      - svelte
      - svelte-*
      - '@sveltejs/*'
      update-types:
      - minor
      - patch
    tailwind:
      patterns:
      - tailwindcss
      - '@tailwindcss/*'
      update-types:
      - minor
      - patch
    vite:
      patterns:
      - vite
      - vitest
      - '@sveltejs/vite-*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /packages/mobile
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  reviewers:
  - natalyscaturchio
  labels:
  - dependencies
  - mobile
  - automated
  groups:
    capacitor:
      patterns:
      - '@capacitor/*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: expo
  - dependency-name: expo-*
  - dependency-name: react
  - dependency-name: '@types/react'
  - dependency-name: react-native
  - dependency-name: react-native-*
  - dependency-name: '@react-navigation/*'
  - dependency-name: '@sentry/react-native'
  - dependency-name: typescript
  - dependency-name: '@babel/*'
    update-types:
    - version-update:semver-major
  - dependency-name: babel-preset-expo
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  reviewers:
  - natalyscaturchio
  labels:
  - dependencies
  - ci
  - automated
  groups:
    github-actions:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  ignore:
  - dependency-name: gr8monk3ys/*
- package-ecosystem: docker
  directory: /docker
  schedule:
    interval: monthly
  open-pull-requests-limit: 3
  cooldown:
    default-days: 7
  reviewers:
  - natalyscaturchio
  labels:
  - dependencies
  - docker
  - automated
