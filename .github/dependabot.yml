version: 2

updates:
  # ──────────────────────────────────────────────
  # Root workspace dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    reviewers:
      - natalyscaturchio
    labels:
      - dependencies
      - automated
    groups:
      # Group minor/patch updates to reduce PR noise
      typescript-ecosystem:
        patterns:
          - "typescript"
          - "typescript-eslint"
          - "@typescript-eslint/*"
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-*"
        update-types:
          - minor
          - patch
      turbo:
        patterns:
          - "turbo"
        update-types:
          - minor
          - patch
    ignore:
      # The root entry scans the whole pnpm workspace lockfile, so the
      # Expo-SDK-pinned mobile packages must be ignored here as well as in
      # the /packages/mobile entry (they are upgraded together via
      # `npx expo install --fix` during SDK upgrades).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "@sentry/react-native"

  # ──────────────────────────────────────────────
  # Backend dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/backend
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    reviewers:
      - natalyscaturchio
    labels:
      - dependencies
      - backend
      - automated
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - minor
          - patch
      drizzle:
        patterns:
          - "drizzle-orm"
          - "drizzle-kit"
        update-types:
          - minor
          - patch
      sentry:
        patterns:
          - "@sentry/*"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "vitest"
          - "supertest"
          - "@types/*"
        update-types:
          - minor
          - patch

  # ──────────────────────────────────────────────
  # Frontend dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/frontend
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    reviewers:
      - natalyscaturchio
    labels:
      - dependencies
      - frontend
      - automated
    groups:
      svelte:
        patterns:
          - "svelte"
          - "svelte-*"
          - "@sveltejs/*"
        update-types:
          - minor
          - patch
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - minor
          - patch
      vite:
        patterns:
          - "vite"
          - "vitest"
          - "@sveltejs/vite-*"
        update-types:
          - minor
          - patch

  # ──────────────────────────────────────────────
  # Mobile dependencies
  # ──────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /packages/mobile
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    reviewers:
      - natalyscaturchio
    labels:
      - dependencies
      - mobile
      - automated
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
        update-types:
          - minor
          - patch
    ignore:
      # These are pinned to the installed Expo SDK (see `expo` in
      # packages/mobile/package.json). Bumping them independently breaks
      # `expo-doctor` and the React Native runtime; they are upgraded
      # together via `npx expo install --fix` during SDK upgrades.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react"
      - dependency-name: "@types/react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "@sentry/react-native"
      - dependency-name: "typescript"

  # ──────────────────────────────────────────────
  # GitHub Actions
  # ──────────────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 2
    reviewers:
      - natalyscaturchio
    labels:
      - dependencies
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Same-owner reusable workflows live in the PRIVATE gr8monk3ys/github
      # repo; Dependabot cannot reach it (git_dependencies_not_reachable)
      # and fails every weekly run. They are pinned manually, not versioned.
      - dependency-name: "gr8monk3ys/*"

  # ──────────────────────────────────────────────
  # Docker base images
  # ──────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: tuesday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 1
    reviewers:
      - natalyscaturchio
    labels:
      - dependencies
      - docker
      - automated
