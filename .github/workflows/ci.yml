permissions: read-all

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  # ──────────────────────────────────────────────
  # Install dependencies (shared across jobs)
  # ──────────────────────────────────────────────
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

  # ──────────────────────────────────────────────
  # Format check
  # ──────────────────────────────────────────────
  format:
    name: Format Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [install]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Check formatting
        run: bun run format:check

  # ──────────────────────────────────────────────
  # Lint
  # ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [install]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build shared (required for imports)
        run: bun run build --filter @finance-owl/shared

      - name: Lint all packages
        run: bun run lint

  # ──────────────────────────────────────────────
  # Typecheck
  # ──────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [install]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build shared (required for type resolution)
        run: bun run build --filter @finance-owl/shared

      - name: Typecheck all packages
        run: bun run typecheck

  # ──────────────────────────────────────────────
  # Unit tests — frontend & shared
  # ──────────────────────────────────────────────
  test-frontend:
    name: Test (Frontend & Shared)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [install]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build shared
        run: bun run build --filter @finance-owl/shared

      - name: Run frontend tests
        run: bun run --filter @finance-owl/frontend test

  # ──────────────────────────────────────────────
  # Unit tests — backend (with PostgreSQL + Redis)
  # ──────────────────────────────────────────────
  test-backend:
    name: Test (Backend)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [install]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_owl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_owl_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-000
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-not-for-prod
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # EncryptionService.onModuleInit rejects anything under 32 chars, so the
      # integration suite cannot boot the Nest app without this.
      ENCRYPTION_MASTER_SECRET: ci-test-encryption-master-secret-not-for-production-use
      FRONTEND_URL: http://127.0.0.1:3000
      NODE_ENV: test

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build shared
        run: bun run build --filter @finance-owl/shared

      - name: Run database migrations
        run: bun run --filter @finance-owl/backend db:migrate

      - name: Run backend unit tests
        run: bun run --filter @finance-owl/backend test --coverage

      - name: Run backend integration tests
        run: bun run --filter @finance-owl/backend test:integration

  # ──────────────────────────────────────────────
  # Build verification
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [install]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Build all packages
        run: bun run build --filter='!@finance-owl/mobile'

  # ──────────────────────────────────────────────
  # Playwright E2E tests
  # ──────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: finance_owl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/finance_owl_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use-000
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret-not-for-prod
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      ENCRYPTION_MASTER_SECRET: ci-test-encryption-master-secret-not-for-production-use
      FRONTEND_URL: http://127.0.0.1:3000
      NODE_ENV: test
      # 127.0.0.1, not localhost: node resolves localhost to ::1 first and the
      # backend listens on IPv4 only, which is the ECONNREFUSED ::1:4000 seen
      # before this job started the API at all.
      API_URL: http://127.0.0.1:4000
      PLAYWRIGHT_API_URL: http://127.0.0.1:4000
      DISABLE_RATE_LIMITING: "1"

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # Bun has no `--filter ... exec`, so run the binary from the package.
      # `--with-deps` shells out to apt-get, and the runner image ships
      # Google's Chrome repo, which has been serving a Packages.gz whose hash
      # does not match its Release file ("E: Failed to fetch ... Hash Sum
      # mismatch") and takes the whole apt run down with it. Playwright
      # downloads its own chromium build and only needs Ubuntu's own libs, so
      # drop that list first.
      - name: Install Playwright browsers
        working-directory: packages/frontend
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          bun x playwright install --with-deps chromium

      - name: Build all packages
        run: bun run build --filter='!@finance-owl/mobile'

      - name: Run database migrations
        run: bun run --filter @finance-owl/backend db:migrate

      # The fixtures sign in as demo@financeowl.com, which only the seed
      # creates — without this every authenticated spec fails on a 401.
      - name: Seed the test database
        run: bun run --filter @finance-owl/backend db:seed

      # Playwright's own webServer only boots the SvelteKit dev server on
      # :3000; the e2e fixtures seed users and data through the REST API.
      - name: Start backend API
        run: |
          bun run --filter @finance-owl/backend start > /tmp/backend.log 2>&1 &
          echo "$!" > /tmp/backend.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000/api/health >/dev/null 2>&1; then
              echo "Backend is up."
              exit 0
            fi
            sleep 1
          done
          echo "Backend did not become healthy within 60s. Its output was:"
          cat /tmp/backend.log
          exit 1

      - name: Run Playwright E2E tests
        run: bun run --filter @finance-owl/frontend test:e2e --project=chromium

      - name: Stop backend API
        if: always()
        run: kill "$(cat /tmp/backend.pid)" 2>/dev/null || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Mobile verification
  # ──────────────────────────────────────────────
  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [install]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Restore node_modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Typecheck mobile app
        run: bun run --filter @finance-owl/mobile typecheck

      - name: Lint mobile app
        run: bun run --filter @finance-owl/mobile lint

      - name: Validate Expo configuration
        run: bun run --filter @finance-owl/mobile check:expo

      - name: Export iOS bundle
        run: bun run --filter @finance-owl/mobile export:ios

  # ──────────────────────────────────────────────
  # Docker build verification (main branch only)
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint, typecheck, test-backend, test-frontend, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        target:
          - name: backend
            dockerfile: docker/Dockerfile.backend
            image: finance-owl-backend
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
            image: finance-owl-frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Build ${{ matrix.target.name }} image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          push: false
          tags: ${{ matrix.target.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────
  # Status gate for branch protection rules
  # ──────────────────────────────────────────────
  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [format, lint, typecheck, test-backend, test-frontend, build, test-e2e, mobile]
    steps:
      - name: Check all required jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "One or more CI jobs did not succeed (got: $result)."
              exit 1
            fi
          done
          echo "All CI jobs passed successfully."
