permissions: read-all

name: Dependabot lockfile

# Dependabot does not regenerate bun.lock for this repo — every PR it opens
# edits only package.json, so `bun install --frozen-lockfile` fails in CI with
# "lockfile had changes, but lockfile is frozen" and nothing else ever runs.
# This regenerates the lockfile on the PR branch so the real checks can.
#
# Workflows triggered by Dependabot get a read-only GITHUB_TOKEN by default;
# the `permissions` block on the job below is what allows the push back.

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "packages/*/package.json"

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"

jobs:
  sync:
    name: Sync bun.lock
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      # Needed for the close/reopen below, not for the push.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.head_ref }}
          # Needed so the push below is authenticated as this workflow.
          persist-credentials: true

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Resolution honours bunfig.toml, so minimumReleaseAge still applies: a
      # bump to a version published in the last 7 days fails here rather than
      # slipping in. That is the intended outcome — dependabot.yml carries a
      # matching 7-day cooldown, so the two should rarely disagree.
      - name: Regenerate the lockfile
        run: bun install

      - name: Commit it if it moved
        id: sync
        run: |
          if git diff --quiet -- bun.lock; then
            echo "bun.lock already matches package.json; nothing to do."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore(deps): sync bun.lock with package.json"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # A push authenticated with GITHUB_TOKEN deliberately does not trigger
      # further workflow runs, so the commit above lands and CI never re-runs
      # — the PR is left reporting "no checks reported". Closing and
      # reopening emits `pull_request: reopened`, which does trigger them.
      - name: Re-run the checks against the synced lockfile
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr close "$PR"
          gh pr reopen "$PR"
