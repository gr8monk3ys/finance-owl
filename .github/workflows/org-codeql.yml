name: org-codeql

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - name: Cost guard
        run: echo "CodeQL is handled by security.yml on scheduled and default-branch runs."
