name: Security

on:
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: "1.4.2"

jobs:
  # ──────────────────────────────────────────────
  # Dependency audit
  # ──────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun audit` covers the whole tree, dev dependencies included — there
      # is no --prod equivalent, and no need for one here. image-size (metro,
      # via react-native) has no patched release at all, so both of its
      # advisories are ignored by GHSA id rather than left to fail the job.
      - name: Run bun audit (high and above)
        run: >-
          bun audit --audit-level=high
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq

      # Informational: everything, including low/moderate and the two above.
      - name: Run bun audit (full, informational)
        run: bun audit
        continue-on-error: true

  # ──────────────────────────────────────────────
  # Dependency review (PRs only)
  # ──────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Dependency review
        uses: actions/dependency-review-action@05fe4576374b728f0c523d6a13d64c25081e0803
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
          comment-summary-in-pr: always

  # ──────────────────────────────────────────────
  # CodeQL analysis
  # ──────────────────────────────────────────────
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          category: /language:${{ matrix.language }}

  # ──────────────────────────────────────────────
  # SAST scanning (Semgrep)
  # ──────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Semgrep
        run: semgrep ci --sarif --output=semgrep-results.sarif
        env:
          SEMGREP_RULES: >-
            p/default
            p/typescript
            p/nodejs
            p/secrets
            p/owasp-top-ten

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        if: always()
        with:
          sarif_file: semgrep-results.sarif

  # ──────────────────────────────────────────────
  # Secret scanning (Gitleaks)
  # ──────────────────────────────────────────────
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # Docker image vulnerability scan (main only)
  # ──────────────────────────────────────────────
  docker-scan:
    name: Docker Image Scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Also on pull_request: this job had never once completed, because the
    # backend image failed to build and, being main-only, nothing caught it
    # before merge. Scanning the images on the PR that changes them is the
    # point of the job. Drop `pull_request` here if the extra two image
    # builds per PR prove too slow.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            dockerfile: docker/Dockerfile.backend
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Build image for scanning
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: docker build -f "$DOCKERFILE" -t scan-target:latest .

      # ignore-unfixed: both images currently carry ~62 CRITICAL/HIGH CVEs
      # from the Debian base (perl-base, util-linux, curl, ncurses...), every
      # one of them with no patched version available. Failing on those means
      # failing forever on something no change to this repo can address.
      # With them excluded, both images report zero — so anything this job
      # now reports is real and actionable.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: scan-target:latest
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        if: always()
        with:
          sarif_file: trivy-results.sarif
