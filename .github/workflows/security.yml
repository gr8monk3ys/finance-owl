name: Security

# This repo is PRIVATE on the free plan, so nothing here may depend on GitHub
# Advanced Security (code scanning). That rules out CodeQL, SARIF uploads
# (github/codeql-action/upload-sarif) and actions/dependency-review-action —
# each fails with "Code scanning is not enabled" / "Resource not accessible
# by integration". Re-add them only if the repo goes public or gets GHAS.
# Every job below reports through its own exit code instead.

on:
  schedule:
    # Weekly on Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.15.0"

jobs:
  # ──────────────────────────────────────────────
  # Dependency audit
  # ──────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Advisories with no patched version are listed in
      # package.json → pnpm.auditConfig.ignoreGhsas, each with a reason.
      - name: Run pnpm audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: Run pnpm audit (all)
        run: pnpm audit --audit-level=critical
        continue-on-error: true

  # ──────────────────────────────────────────────
  # SAST scanning (Semgrep)
  # ──────────────────────────────────────────────
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # `semgrep ci` exits non-zero on blocking findings; on pull_request it
      # scans only the diff against the merge base, on push/schedule the
      # whole tree. Findings are printed in the job log.
      - name: Run Semgrep
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/default
            p/typescript
            p/nodejs
            p/secrets
            p/owasp-top-ten

  # ──────────────────────────────────────────────
  # Secret scanning (Gitleaks)
  # ──────────────────────────────────────────────
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # On pull_request the action lists the PR's commits via the API; without
      # this it dies with "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      # Known false positives (placeholders, CI fixtures, a CSS colour) are
      # listed by fingerprint in .gitleaksignore.
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR review comments need pull-requests: write, which a private
          # repo's token does not get on Dependabot PRs. The job log and
          # step summary carry the findings instead.
          GITLEAKS_ENABLE_COMMENTS: "false"

  # ──────────────────────────────────────────────
  # Docker image vulnerability scan (main only)
  # ──────────────────────────────────────────────
  docker-scan:
    name: Docker Image Scan (${{ matrix.image.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: backend
            dockerfile: docker/Dockerfile.backend
          - name: frontend
            dockerfile: docker/Dockerfile.frontend
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build image for scanning
        env:
          DOCKERFILE: ${{ matrix.image.dockerfile }}
        run: docker build -f "$DOCKERFILE" -t scan-target:latest .

      # Table output to the job log; exit-code 1 fails the job on any fixable
      # CRITICAL/HIGH finding (no SARIF upload — needs code scanning).
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@e368e328979b113139d6f9068e03accaed98a518
        with:
          image-ref: scan-target:latest
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
