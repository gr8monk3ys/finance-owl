<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{TITLE}}</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f1117;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      color: #e2e8f0;
      -webkit-font-smoothing: antialiased;
    }
    .wrapper {
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .header {
      text-align: center;
      padding: 24px 0;
      border-bottom: 1px solid #2d3748;
    }
    .logo {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      text-decoration: none;
    }
    .logo-icon {
      display: inline-block;
      width: 32px;
      height: 32px;
      background-color: #6366f1;
      border-radius: 8px;
      vertical-align: middle;
      margin-right: 8px;
      text-align: center;
      line-height: 32px;
      font-size: 18px;
    }
    .content {
      padding: 32px 0;
    }
    .card {
      background-color: #1a1d2e;
      border: 1px solid #2d3748;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 16px;
    }
    .footer {
      text-align: center;
      padding: 24px 0;
      border-top: 1px solid #2d3748;
      color: #718096;
      font-size: 12px;
      line-height: 1.6;
    }
    .footer a {
      color: #818cf8;
      text-decoration: none;
    }
    h1 {
      color: #ffffff;
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px 0;
    }
    h2 {
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      margin: 0 0 12px 0;
    }
    p {
      color: #cbd5e0;
      font-size: 14px;
      line-height: 1.6;
      margin: 0 0 12px 0;
    }
    .btn {
      display: inline-block;
      background-color: #6366f1;
      color: #ffffff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      margin-top: 8px;
    }
    .muted {
      color: #718096;
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-warning {
      background-color: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
    }
    .badge-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }
    .badge-info {
      background-color: rgba(99, 102, 241, 0.15);
      color: #818cf8;
    }
    .badge-success {
      background-color: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }
    .amount {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
    }
    .divider {
      border: none;
      border-top: 1px solid #2d3748;
      margin: 16px 0;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
    }
    .stat-label {
      color: #a0aec0;
      font-size: 13px;
    }
    .stat-value {
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
    }
    table.stats {
      width: 100%;
      border-collapse: collapse;
    }
    table.stats td {
      padding: 8px 0;
      font-size: 13px;
    }
    table.stats td:first-child {
      color: #a0aec0;
    }
    table.stats td:last-child {
      color: #ffffff;
      font-weight: 500;
      text-align: right;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <a href="#" class="logo">
        <span class="logo-icon">&#x1F989;</span>
        FinanceOwl
      </a>
    </div>

    <div class="content">
      {{CONTENT}}
    </div>

    <div class="footer">
      <p>You received this email because you have notifications enabled in FinanceOwl.</p>
      <p>
        <a href="{{SETTINGS_URL}}">Manage notification preferences</a>
      </p>
      <p>&copy; {{YEAR}} FinanceOwl. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
